name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Web quality and production bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: private-vault-web-dist
          path: dist/
          if-no-files-found: error

  security:
    name: Source security
    uses: ./.github/workflows/sast.yml

  android:
    name: Android APK and signing guard
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: private-vault-web-dist
          path: dist/
      - run: npm run android:sync
      - name: Build installable test APKs
        working-directory: android-capacitor
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Unsigned production release must fail closed
        working-directory: android-capacitor
        shell: bash
        run: |
          if ./gradlew --no-daemon :app:assembleRelease > signing-guard.log 2>&1; then
            echo "ERROR: release unexpectedly built without signing credentials"
            exit 1
          fi
          grep -F "Production signing credentials are required" signing-guard.log
      - name: Collect APK and source evidence
        shell: bash
        run: |
          mkdir -p artifacts
          cp android-capacitor/app/build/outputs/apk/debug/app-debug.apk artifacts/Private-Vault-1.0.0-DEBUG-TEST-ONLY.apk
          cp android-capacitor/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk artifacts/
          printf 'source_sha=%s\nworkflow=%s/%s/actions/runs/%s\nvariant=DEBUG-TEST-ONLY\napplication_id=me.hculab.privatevault.web\n' \
            "$(git rev-parse HEAD)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > artifacts/BUILD_INFO.txt
          cp package-lock.json artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: private-vault-android-test
          path: artifacts/
          if-no-files-found: error

  emulator:
    name: Android emulator acceptance
    needs: android
    uses: ./.github/workflows/android-integration.yml
