name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  quality:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage --exclude-tags golden

      - name: Security and Work Profile contract tests
        run: flutter test test/unit/logging_contract_test.dart test/unit/platform_privacy_contract_test.dart test/unit/work_profile_android_contract_test.dart test/unit/work_profile_native_contract_test.dart test/unit/work_profile_models_test.dart test/widget/work_profile_navigation_test.dart test/widget/work_profile_home_test.dart

  android:
    name: Android debug + signing contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Native Android unit tests
        working-directory: android
        run: ./gradlew app:testDebugUnitTest

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify release signing fails closed without secrets
        shell: bash
        run: |
          set +e
          output="$(flutter build apk --release 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -F "Release signing is not configured." <<< "$output"

      - name: Verify aggregate Android build fails closed without secrets
        working-directory: android
        shell: bash
        run: |
          set +e
          output="$(./gradlew :app:assemble --dry-run 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -F "Release signing is not configured." <<< "$output"

      - name: Verify release-variant development tasks do not require signing
        working-directory: android
        shell: bash
        run: |
          ./gradlew :app:testReleaseUnitTest --dry-run
          ./gradlew :app:compileReleaseKotlin --dry-run

      - name: Verify unrelated modules do not require app signing
        working-directory: android
        shell: bash
        run: |
          set +e
          build_output="$(./gradlew :android_file_picker:build --dry-run 2>&1)"
          release_output="$(./gradlew :android_file_picker:assembleRelease --dry-run 2>&1)"
          set -e
          printf '%s\n%s\n' "$build_output" "$release_output"
          ! grep -F "Release signing is not configured." <<< "$build_output"
          ! grep -F "Release signing is not configured." <<< "$release_output"

      - name: Upload Android debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: private-vault-mobile-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS no-codesign smoke
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build iOS without codesign
        run: flutter build ios --release --no-codesign
