name: Release Android Test

on:
  push:
    tags: ["android-web-v*-test.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified test APK
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: private-vault-android-test
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: android-smoke-evidence
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: semgrep-sast-report
          path: artifacts/
      - name: Package exact-source evidence
        shell: bash
        run: |
          test "$(sed -n 's/^source_sha=//p' artifacts/BUILD_INFO.txt)" = "$(git rev-parse HEAD)"
          cp docs/release/ANDROID_TEST_RELEASE.md artifacts/RELEASE_NOTES.md
          cd artifacts
          sha256sum Private-Vault-1.0.0-DEBUG-TEST-ONLY.apk BUILD_INFO.txt package-lock.json android-smoke.txt semgrep.sarif RELEASE_NOTES.md > SHA256SUMS.txt
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --prerelease \
            --title "Private Vault 1.0.0 - Android test build" \
            --notes-file docs/release/ANDROID_TEST_RELEASE.md \
            artifacts/Private-Vault-1.0.0-DEBUG-TEST-ONLY.apk \
            artifacts/BUILD_INFO.txt artifacts/SHA256SUMS.txt \
            artifacts/package-lock.json artifacts/android-smoke.txt \
            artifacts/semgrep.sarif artifacts/RELEASE_NOTES.md
