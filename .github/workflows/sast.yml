name: SAST

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep source-security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pinned Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.177.0

      - name: Run SAST
        run: |
          semgrep scan \
            --config=p/security-audit \
            --config=.semgrep.yml \
            --severity ERROR \
            --error \
            --metrics=off \
            --sarif \
            --output=semgrep.sarif \
            --exclude=.tooling \
            --exclude=.dart_tool \
            --exclude=build \
            --exclude=test \
            .

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sast-report
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 14
