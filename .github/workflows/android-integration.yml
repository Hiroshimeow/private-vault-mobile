name: Android Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  emulator:
    name: Android emulator RC integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
          pub-cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Configure KVM when available
        shell: bash
        run: |
          set -u
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules || true
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod 0666 /dev/kvm || true
            if [[ -r /dev/kvm && -w /dev/kvm ]]; then
              echo "KVM available; emulator will use hardware acceleration."
            else
              echo "KVM device exists but is not accessible; emulator runner will fall back automatically."
            fi
          else
            echo "KVM is not exposed on this runner; emulator runner will use software acceleration."
          fi

      - name: Run RC integration on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 900
          script: |
            flutter test integration_test/private_vault_rc_test.dart -d emulator-5554
            bash tool/work_profile_clone_smoke.sh emulator-5554

      - name: Upload integration logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-integration-failure
          path: |
            build/
          if-no-files-found: ignore
          retention-days: 14
